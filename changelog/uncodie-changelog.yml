notes: >-
  Makinari publishes a public product changelog. Round 1 (2026-07-21) recorded
  it as month-dated only; each entry now also carries a semantic version and
  its own permalink page (/product/changelog/v1-5-0 …), with an Overview, Key
  Changes and Developer Notes section. Recent window captured 2026-08-13 — the
  five published releases, newest first. No release notes newer than v1.5.0
  (March 2026) were published as of this pass, so the changelog has not been
  updated in roughly five months.
  These are PRODUCT releases, not API versions: the REST API is still v1 in the
  URI path and no entry announces an API breaking change. Nothing in the
  changelog announces the commerce expansion visible in the MCP tool catalogue
  (quotations, purchases, entitlements, reservations, checkout), so the API
  surface is moving faster than the published release notes.
