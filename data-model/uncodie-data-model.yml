notes: >-
  Makinari publishes no OpenAPI document, so this entity graph is derived from
  the only machine-shaped contract the company does publish: the input schemas
  on its 56 MCP tool documentation pages. Each tool that manages a resource is
  treated as one entity; every parameter whose name ends in `_id`/`_ids` is
  treated as a reference edge to the entity that owns that identifier. Nothing
  here is invented — every entity, field count and edge traces to a published
  parameter on a page listed in `docs:`. Field types are UUID strings unless
  the tool page says otherwise.
  Two clusters dominate. The GTM/CRM core (site, user, lead, visitor, segment,
  campaign, conversation, message, task, content, audience) is the original
  product. A full commerce core (catalog_item, quotation + quotation_item,
  sales_order, sale, purchase + purchase_item, entitlement,
  subscription_plan_item, reservation + reservation_schedule, checkout) was
  added since the round-1 pass and is what the ten new MCP tools expose.
  `site_id` is the tenancy root: it appears on nearly every entity, so every
  read and write is scoped to a site.
tenancy:
  root_entity: site
  field: site_id
  notes: >-
    Almost every tool requires site_id; API keys are themselves issued per
    site and user (POST /api/keys with site_id + user_id), so the site is the
    isolation boundary for both data and credentials.
