notes: >-
  Makinari documents that a 429 "Rate limit exceeded" response exists, but
  publishes NO numeric limits, no windows, and no rate-limit response headers
  on any surface — REST API, Agents API, Workflows, Content API or the MCP
  server. An agent therefore cannot pace itself from the documentation; it can
  only react after exhaustion. The pricing page instead governs consumption
  through a credit/usage model (20/100/500 credits per month by tier, plus
  metered per-call charges), which is a billing quota rather than a request
  rate limit — that is recorded in plans/uncodie-plans-pricing.yml.
  The marketing page for agent workloads claims "Budget and rate limiters" as
  an enterprise governance feature, but no limits are documented.
  The only rate-limit engineering the company publishes is
  docs/RATE_LIMIT_ERROR_HANDLING.md in the open-source API repo, and that
  describes how Makinari's agent processor handles 429s it receives FROM its
  upstream LLM providers (60s wait, then exponential backoff) — it is not a
  statement of Makinari's own limits for its API consumers.
