- name: deals
  description: Manage sales deals and opportunities. Use action="create" to record a new deal. Use action="update"
    to modify a deal. Use action="list" to search deals. Use action="delete" to remove a deal record.
  docs: https://docs.makinari.com/mcp-server/tools/deals
  input_schema:
  - name: action
    type: string
    description: 'Action to perform on deals. Enum: create, list, update, delete'
  - name: deal_id
    type: string
    description: Deal UUID (required for update/delete)
  - name: site_id
    type: string
    description: Site UUID
  - name: amount
    type: number
    description: Deal amount
  - name: currency
    type: string
    description: Currency code (e.g. USD)
  - name: stage
    type: string
    description: Deal stage in the sales pipeline (e.g. prospecting, proposal, negotiation, closed_won)
  - name: status
    type: string
    description: Overall deal status (e.g. open, won, lost)
  - name: company_id
    type: string
    description: Company UUID
  - name: expected_close_date
    type: string
    description: Date string for expected close (YYYY-MM-DD)
  - name: notes
    type: string
    description: Deal notes
  - name: qualification_score
    type: number
    description: Qualification score
  - name: qualification_criteria
    type: object
    description: JSON object with qualification specifics
  - name: sales_order_id
    type: string
    description: Related Sale/Order UUID if closed
  - name: lead_ids
    type: array
    description: Array of Lead UUIDs attached to this deal
  - name: owner_ids
    type: array
    description: Array of User UUIDs who own this deal
  - name: limit
    type: number
    description: Limit results
  - name: offset
    type: number
    description: Offset results
- name: entitlements
  description: Read and manage digital entitlements. Use action="list" to find entitlements by buyer or
    status. Use action="get" to read a single entitlement. Use action="update" to change status (e.g.
    to "revoked" or "used") or update expires_at. Do not invent grants here; entitlements are normally
    created via Stripe webhook after a checkout.
  docs: https://docs.makinari.com/mcp-server/tools/entitlements
  input_schema:
  - name: action
    type: string
    description: 'Action to perform: list, get, update'
  - name: id
    type: string
    description: Entitlement UUID (required for get, update)
  - name: site_id
    type: string
    description: Seller site UUID
  - name: buyer_user_id
    type: string
    description: Buyer user UUID
  - name: owner_site_id
    type: string
    description: Destination owner site UUID
  - name: status
    type: string
    description: 'Entitlement status: active, revoked, expired, used'
  - name: source_type
    type: string
    description: 'Source type: purchase or subscription'
  - name: expires_at
    type: string
    description: Expiration date (ISO string)
  - name: limit
    type: number
    description: Limit results for list
  - name: offset
    type: number
    description: Offset results for list
- name: extractFrames
  description: Extracts frames (images) from a video or GIF URL. Returns an array of base64 images that
    can be analyzed or stored. Useful for visually understanding a video by passing the frames to a vision
    model.
  docs: https://docs.makinari.com/mcp-server/tools/extractFrames
  input_schema:
  - name: video_url
    type: string
    description: The valid public URL of the video or GIF to extract frames from.
  - name: frame_count
    type: number
    description: Number of frames to extract evenly spaced across the video (default 5, max 10).
- name: generateAudio
  description: 'The generateAudio tool allows AI assistants to generate audio from text (Text-to-Speech)
    using AI providers. Currently, it fully supports the gemini provider (default) and vercel provider
    (which interfaces with OpenAI''s TTS). Use Cases Converting text responses or generated stories into
    playable audio files. Narrating content for multimedia creation. Creating voice messages or podcast-style
    content within the conversation. Parameters The tool accepts the following parameters: Parameter Type
    Required Description text string Y'
  docs: https://docs.makinari.com/mcp-server/tools/generateAudio
  input_schema:
  - name: text
    type: string
    description: 'Yes'
  - name: provider
    type: string
    description: 'No'
  - name: voice
    type: string
    description: 'No'
  - name: format
    type: string
    description: 'No'
  - name: model
    type: string
    description: 'No'
- name: generateImage
  description: Generate images using AI with automatic provider fallback. Supports multiple AI providers
    (Gemini, Azure, Vercel) with automatic fallback if one fails. Images are automatically saved to storage
    and can be used in conversations or content.
  docs: https://docs.makinari.com/mcp-server/tools/generateImage
  input_schema:
  - name: prompt
    type: string
    description: Detailed text description of the image to generate. Be specific about style, colors,
      composition, and any important details.
  - name: provider
    type: string
    description: AI provider to use for generation. Only Gemini is currently supported.
  - name: size
    type: string
    description: 'Size of the generated image. Defaults to 1024x1024 for best quality. Enum: 256x256,
      512x512, 1024x1024'
  - name: n
    type: number
    description: Number of images to generate. Defaults to 1.
  - name: quality
    type: string
    description: 'Quality of the generated image. HD quality is higher resolution but may take longer.
      Defaults to standard. Enum: standard, hd'
  - name: ratio
    type: string
    description: 'Aspect ratio of the generated image. Defaults to 1:1 (square). Enum: 1:1, 4:3, 3:4,
      16:9, 9:16, 3:2, 2:3'
  - name: reference_images
    type: array
    description: Array of image URLs to use as reference/context for generation. Images will be converted
      to base64 and sent as context to the AI model.
- name: generateVideo
  description: Generate videos using AI with automatic provider fallback. Supports Gemini Veo 3.1 for
    video generation. Videos are automatically saved to storage and can be used in conversations or content.
  docs: https://docs.makinari.com/mcp-server/tools/generateVideo
  input_schema:
  - name: prompt
    type: string
    description: Detailed text description of the video to generate. Be specific about style, colors,
      composition, movement, and any important details.
  - name: provider
    type: string
    description: AI provider to use for generation. Only Gemini is currently supported.
  - name: duration_seconds
    type: number
    description: Desired duration of the video in seconds. Will be mapped to valid values (4, 6, or 8
      seconds) by the API. Defaults to 8 seconds.
  - name: aspect_ratio
    type: string
    description: 'Aspect ratio of the generated video. Note: Gemini only supports 16:9 and 9:16, other
      ratios will be mapped to 16:9. Defaults to 16:9. Enum: 1:1, 4:3, 3:4, 16:9, 9:16, 3:2, 2:3'
  - name: reference_images
    type: array
    description: Array of image URLs (up to 3) to use as reference/context for generation. Images will
      be converted to base64 and sent as context to the AI model. When using reference images, duration
      must be 8 seconds.
  - name: quality
    type: string
    description: 'Quality of the generated video. "preview" and "standard" use 720p. "pro" uses 1080p
      but requires duration=8 and aspect_ratio=16:9. Defaults to standard. Enum: preview, standard, pro'
  - name: model
    type: string
    description: 'Override the Gemini model to use (default: veo-3.1-generate-preview).'
- name: getFinderCategoryIds
  description: 'category IDs from Finder autocomplete. Categories: industries, organizations, organization_keywords,
    locations, person_skills, web_technologies. Returns results with id and text. IMPORTANT: Use this
    tool BEFORE analyzeICPTotalCount or createIcpMining when the user mentions industries, locations,
    job skills, etc. - those tools require IDs, not free text. Search with q to find the correct ID.'
  docs: https://docs.makinari.com/mcp-server/tools/getFinderCategoryIds
  input_schema:
  - name: category
    type: string
    description: 'Category to search: industries, organizations, organization_keywords, locations, person_skills,
      web_technologies. Enum: industries, organizations, organization_keywords, locations, person_skills,
      web_technologies'
  - name: q
    type: string
    description: Search term (e.g. "technology", "New York", "Marketing Manager") to find matching IDs
  - name: page
    type: number
    description: Page number for pagination (default 1)
- name: instance
  description: 'Manage AI assistant instances (CRU operations: create, read, update). Use "create" to
    start a new instance for a specific activity. Use "read" to get details of the current instance or
    list instances for the site. Use "update" to automatically rename the instance based on context (if
    it has a generic name or the objective changed) or update other properties. IMPORTANT: You MUST call
    this tool with action "update" if the instance has a generic name ("Assistant Session", "New Instance",
    etc.) or if the conversation objective has changed significantly.'
  docs: https://docs.makinari.com/mcp-server/tools/instance
  input_schema:
  - name: action
    type: string
    description: 'The action to perform. Enum: "create", "read", "update".'
  - name: site_id
    type: string
    description: Site UUID (required for create and read, optional for update).
  - name: instance_id
    type: string
    description: Instance UUID (optional, defaults to current instance).
  - name: activity
    type: string
    description: 'Required for create: The main activity or purpose of the new instance.'
  - name: context
    type: string
    description: 'Optional for update: Context about what the user is trying to accomplish for smart renaming.'
  - name: status
    type: string
    description: 'Optional for create and update: Set status (e.g. running, paused, stopped). On create
      defaults to "running".'
  - name: limit
    type: number
    description: 'Optional for read: Limit number of results.'
  - name: offset
    type: number
    description: 'Optional for read: Offset for pagination.'
- name: instanceLogs
  description: The instance_logs tool enables you to create and list logs associated with an instance.
    Use this tool whenever you perform significant actions that should be tracked, encounter errors, or
    need to review the history of actions performed by you or the user within an instance. Parameters
    Parameter Type Required Description action string No The action to perform ( create or list ). Defaults
    to create . instance_id string No The ID of the instance processing the requirement (defaults to current
    instance). user_id string No The ID
  docs: https://docs.makinari.com/mcp-server/tools/instanceLogs
  input_schema:
  - name: action
    type: string
    description: 'No'
  - name: instance_id
    type: string
    description: 'No'
  - name: user_id
    type: string
    description: 'No'
  - name: log_type
    type: string
    description: Yes*
  - name: level
    type: string
    description: Yes*
  - name: message
    type: string
    description: Yes*
  - name: details
    type: object
    description: 'No'
  - name: limit
    type: number
    description: 'No'
  - name: offset
    type: number
    description: 'No'
- name: instancePlan
  description: 'Manage instance plans. IMPORTANT: Instance plans are strict execution paths for YOU (the
    agent), composed of tool calls, processes, reviews, discussions, or user inputs to ensure task success.
    They are NOT general plans for the user. Use action="create" to define a new execution path (use when
    the plan is different from the previous one). Use action="list" to get current plans; use action="update"
    to add new steps or reopen an existing plan (same objective, just new steps). Use action="execute_step"
    to execute and record the result of each step individually. Always finish executi'
  docs: https://docs.makinari.com/mcp-server/tools/instancePlan
  input_schema:
  - name: action
    type: string
    description: 'Action to perform on instance plans. Enum: create, list, update, execute_step'
  - name: instance_id
    type: string
    description: Instance UUID (required for create/list if not running in instance context)
  - name: plan_id
    type: string
    description: Plan UUID (required for update, and execute_step)
  - name: step_id
    type: string
    description: Step UUID (required for execute_step)
  - name: step_output
    type: string
    description: Output of the executed step (required for execute_step)
  - name: step_status
    type: string
    description: 'Status of the executed step (required for execute_step). Enum: pending, in_progress,
      completed, failed'
  - name: title
    type: string
    description: Plan title
  - name: description
    type: string
    description: Plan description
  - name: plan_type
    type: string
    description: 'Type of plan. Must be one of: objective, task. Default: objective. Enum: objective,
      task'
  - name: instructions
    type: string
    description: Overall instructions for the plan
  - name: expected_output
    type: string
    description: Overall expected output of the plan
  - name: success_criteria
    type: array
    description: Criteria for successful completion
  - name: validation_rules
    type: array
    description: Rules for validating the plan execution
  - name: status
    type: string
    description: 'Plan status. For create, use "pending" or leave empty for default. Enum: pending, in_progress,
      completed, failed, cancelled, paused'
  - name: steps
    type: array
    description: Array of plan steps with detailed properties.
  - name: site_id
    type: string
    description: Site UUID
  - name: user_id
    type: string
    description: User UUID
  - name: agent_id
    type: string
    description: Agent UUID
  - name: limit
    type: number
    description: Limit results
  - name: offset
    type: number
    description: Offset results
- name: leads
