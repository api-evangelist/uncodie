  docs: https://docs.makinari.com/mcp-server/tools/leads
  input_schema:
  - name: action
    type: string
    description: 'Action to perform on leads. Enum: create, list, update, qualify, identify'
  - name: lead_id
    type: string
    description: Lead UUID
  - name: email
    type: string
    description: Email address
  - name: phone
    type: string
    description: Phone number
  - name: position
    type: string
    description: Job title/position
  - name: company
    type: string
    description: Company name
  - name: notes
    type: string
    description: Notes
  - name: status
    type: string
    description: new, contacted, qualified, converted, lost
  - name: origin
    type: string
    description: Lead source (e.g. website, referral)
  - name: segment_id
    type: string
    description: Segment UUID
  - name: campaign_id
    type: string
    description: Campaign UUID
  - name: assignee_id
    type: string
    description: Assignee user UUID
  - name: site_id
    type: string
