generated: '2026-07-21'
method: searched
source: https://docs.makinari.com/mcp-server
status: published
notes: >-
  Uncodie rebranded as Makinari (www.uncodie.com redirects to www.makinari.com).
  Makinari publishes an official hosted MCP server plus a local install path
  (the API repo github.com/Makinari/API is private; the docs describe both modes).
  Remote endpoint verified documented at docs.makinari.com/mcp-server/setup/remote.
server:
  name: makinari
  transport: http
  url: https://backend.makinari.com/api/mcp
  authentication: API key (Bearer)
  docs: https://docs.makinari.com/mcp-server
  setup:
    remote: https://docs.makinari.com/mcp-server/setup/remote
    local: https://docs.makinari.com/mcp-server/setup/local
  local:
    repository: https://github.com/Makinari/API
    run: npm run mcp        # stdio mode
    http_endpoint: POST /api/mcp   # JSON-RPC over HTTP
    environment:
      - MCP_SITE_ID (required)
      - MCP_USER_ID (optional)
      - MCP_INSTANCE_ID (optional, default 'default')
      - API_URL (optional, default http://localhost:3000)
      - REST_API_KEY (required for remote API)
      - SERVICE_API_KEY (required when running the API locally)
