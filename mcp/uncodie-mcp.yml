- name: urlToMarkdown
  description: Converts the content of a webpage URL into Markdown format. Useful for extracting text
    content for analysis.
  docs: https://docs.makinari.com/mcp-server/tools/urlToMarkdown
  input_schema:
  - name: url
    type: string
    description: The URL of the webpage to convert to Markdown
- name: urlToSitemap
  description: Extracts the sitemap of a website to discover its structure and page URLs. Useful for navigation
    and understanding site layout.
  docs: https://docs.makinari.com/mcp-server/tools/urlToSitemap
  input_schema:
  - name: url
    type: string
    description: The URL of the website to extract the sitemap from
- name: webSearch
  description: Perform a web search to get real-time information. Powered by Tavily. Returns an AI-generated
    answer plus individual result snippets.
  docs: https://docs.makinari.com/mcp-server/tools/webSearch
  input_schema:
  - name: query
    type: string
    description: The search query to perform.
  - name: search_depth
    type: string
    description: 'Depth of the search. Enum: basic, advanced. Default: basic.'
  - name: max_results
    type: number
    description: 'Max number of results to return (1–20). Default: 5.'
  - name: include_answer
    type: boolean
    description: 'Include an AI-generated answer summarizing the results. Default: true.'
  - name: include_images
    type: boolean
    description: 'Include image results. Default: false.'
  - name: include_domains
    type: array
    description: Restrict results to these domains (e.g. ["wikipedia.org"]).
  - name: exclude_domains
    type: array
    description: Exclude results from these domains.
- name: webhooks
  description: Manage webhooks. Use action="list" to get all webhooks. Use action="create" with url and
    events (array of strings) to register a new webhook.
  docs: https://docs.makinari.com/mcp-server/tools/webhooks
  input_schema:
  - name: action
    type: string
    description: 'Action to perform: "list" to get webhooks, "create" to register a new one. Enum: list,
      create'
  - name: url
    type: string
    description: The URL for the webhook (required for create action).
  - name: events
    type: array
    description: List of events to subscribe to (required for create action).
- name: whatsappTemplate
  description: 'WhatsApp templates are required when sending to a user more than 24 hours after their
    last message. Use action create_template first (phone_number, message); if it returns template_id,
    then use action send_template (template_id, phone_number, original_message) to deliver the message.
    If create_template returns template_required: false, the conversation is within the 24h window - use
    sendWhatsApp instead.'
  docs: https://docs.makinari.com/mcp-server/tools/whatsappTemplate
  input_schema:
  - name: action
    type: string
    description: 'create_template: check 24h window and create or find template, returns template_id when
      needed. send_template: send a message using an existing template_id. Enum: create_template, send_template'
  - name: phone_number
    type: string
    description: Recipient phone in international format (required for both actions)
  - name: message
    type: string
    description: Message content (required for create_template; used as template body)
  - name: template_id
    type: string
    description: Template SID from create_template result (required for send_template)
  - name: conversation_id
    type: string
    description: Conversation UUID for 24h window check (optional for create_template)
  - name: from
    type: string
    description: Sender name (optional)
  - name: original_message
    type: string
    description: Original message text for logging (optional for send_template)
- name: workflows
  description: Execute business and data workflows. Use this tool to trigger complex backend processes
    like lead research, campaign building, content generation, sending emails/whatsapp, etc.
  docs: https://docs.makinari.com/mcp-server/tools/workflows
  input_schema:
  - name: action
    type: string
    description: 'The workflow action to execute. Enum: idealClientProfileMining, buildCampaigns, buildContent,
      buildSegments, buildSegmentsICP, leadFollowUp, leadResearch, enrichLead, leadGeneration, analyzeSite,
      assignLeads, leadInvalidation, dailyProspection, leadQualification, dailyStrategicAccounts, sendEmailFromAgent,
      sendWhatsappFromAgent, scheduleCustomerSupport, answerWhatsappMessage, dailyStandUp, customerSupportMessage,
      agentMessage, startRobot, promptRobot, stopRobot'
  - name: payload
    type: object
    description: The parameters for the workflow. Must include site_id (automatically injected if not
      provided) and other specific fields depending on the action.
