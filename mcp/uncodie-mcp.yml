  - name: contact_info
    type: object
    description: Contact details
  - name: company_info
    type: object
    description: Company details
  - name: interest_level
    type: string
    description: Interest level
  - name: product_interest
    type: string
    description: Product interest
  - name: pages_visited
    type: array
    description: Pages visited
  - name: time_spent
    type: number
    description: Time spent
  - name: visit_count
    type: number
    description: Visit count
- name: memories
  description: 'Manage agent memories. Actions: "save" (create new), "list" (search/filter), "update"
    (modify existing), "delete" (remove).'
  docs: https://docs.makinari.com/mcp-server/tools/memories
  input_schema:
  - name: action
    type: string
    description: 'Action to perform on memories. Enum: save, list, update, delete'
  - name: content
    type: string
    description: The content to save or update. Required for "save", optional for "update".
  - name: key
    type: string
    description: Optional categorization key (e.g. "user_preferences"). used in save/update.
  - name: memory_id
    type: string
    description: The ID of the memory to update or delete. Required for "update" and "delete" actions.
  - name: search_query
    type: string
    description: Optional search term to filter memories (searches in content, summary, and key).
  - name: type
    type: string
    description: Optional memory type filter. Default is "assistant_note".
  - name: limit
    type: number
    description: Maximum number of memories to return. Default 10.
  - name: client_id
    type: string
    description: Optional. Scope to a specific client.
  - name: project_id
    type: string
    description: Optional. Scope to a specific project.
  - name: task_id
    type: string
    description: Optional. Scope to a specific task.
- name: messages
  description: 'List messages for this site. Rules: Always provide conversation_id when you have it -
    site-wide queries are slower and return less context. Use role="user" to see only visitor/lead messages;
    role="assistant" for bot replies. Default limit is 50 (max 100). Check pagination.has_more before
    paginating further. Stop paginating when has_more=false or when you have found the information you
    need - do NOT blindly paginate through hundreds of records. If you get an error, do NOT retry with
    a higher offset. Instead, try a narrower filter (e.g. add conversation_id or lead_id).'
  docs: https://docs.makinari.com/mcp-server/tools/messages
  input_schema:
  - name: action
    type: string
    description: 'Action to perform (only "list" is supported). Enum: list'
  - name: conversation_id
    type: string
    description: Preferred. Filter to a single conversation UUID. Omit only when you need site-wide results.
  - name: lead_id
    type: string
    description: Filter by lead UUID.
  - name: role
    type: string
    description: 'Filter by message role. Enum: user, assistant, system, team_member'
  - name: interaction
    type: string
    description: Filter by interaction type (e.g. opened, clicked - for email tracking).
  - name: custom_data_status
    type: string
    description: Filter by custom_data.status (JSONB field).
  - name: limit
    type: number
    description: Max results per page. Default 50, max 100.
  - name: offset
    type: number
    description: Pagination offset. Only increment if has_more=true in the previous response.
- name: publish
  description: 'The publish tool is a consolidated tool that allows the agent to perform multiple publishing
    actions in a single tool call. It can: Create or Update Content: Save content to the database with
    a published status, including metadata like assets and URLs. Publish to Social Media: Publish the
    content to specified social media accounts via Outstand. Send to Audience: Send the content as a bulk
    message to an audience via WhatsApp or Email. Usage You must provide at least one valid source of
    content: text , assets (media IDs), or urls . You must als'
  docs: https://docs.makinari.com/mcp-server/tools/publish
  input_schema: []
- name: purchase_items
  description: Manage line items on a vendor bill / purchase order. Use after creating a purchases header.
    Use action="create" to add a line (requires purchase_id and name or catalog_item_id). Totals on the
    parent purchase are recalculated automatically.
  docs: https://docs.makinari.com/mcp-server/tools/purchase_items
  input_schema:
  - name: action
    type: string
    description: 'Action to perform: create, list, update, delete'
  - name: id
    type: string
    description: Item UUID (required for update, delete)
  - name: purchase_id
    type: string
    description: Purchase UUID (required for create, list)
  - name: catalog_item_id
    type: string
    description: Catalog Item UUID (optional; hydrates name/unit_cost)
  - name: quantity
    type: number
    description: Quantity (defaults to 1)
  - name: unit_cost
    type: number
    description: Unit cost (optional if catalog_item_id provides cost)
  - name: limit
    type: number
    description: Limit results for list
  - name: offset
    type: number
    description: Offset results for list
- name: purchases
  description: Manage vendor bills / purchase orders (accounts payable). Use for money owed or paid to
    suppliers — NOT buyer checkout. Use action="create" for a draft header (requires title). Use purchase_items
    to add lines. Use action="register_payment" to record a supplier payment.
  docs: https://docs.makinari.com/mcp-server/tools/purchases
  input_schema:
  - name: action
    type: string
    description: 'Action to perform: create, list, get, update, delete, register_payment'
  - name: id
    type: string
    description: Purchase UUID (required for get, update, delete, register_payment)
  - name: site_id
    type: string
    description: Site UUID
  - name: title
    type: string
    description: Bill / PO title (required for create)
  - name: vendor_company_id
    type: string
    description: Vendor company UUID
  - name: status
    type: string
    description: 'Purchase status: draft, pending, completed, cancelled'
  - name: amount_due
    type: number
    description: Amount still due to the vendor
  - name: currency
    type: string
    description: Currency code (e.g. USD, MXN)
  - name: purchase_date
    type: string
    description: Purchase date (YYYY-MM-DD)
  - name: location_id
    type: string
    description: Location UUID (warehouse / site location)
  - name: notes
    type: string
    description: Notes for the purchase
  - name: amount
    type: number
    description: Payment amount (required for register_payment)
  - name: method
    type: string
    description: Payment method (required for register_payment)
  - name: payment_notes
    type: string
    description: Optional notes for register_payment
  - name: limit
    type: number
    description: Limit results for list
  - name: offset
    type: number
    description: Offset results for list
- name: quotation_items
  description: Manage lines (items) inside a quotation. Use action="create" to add an item. Use action="update"
    to change quantity/price. Use action="delete" to remove an item. These actions automatically recalculate
    the quotation totals.
  docs: https://docs.makinari.com/mcp-server/tools/quotation_items
  input_schema:
  - name: action
    type: string
    description: 'Action to perform: create, list, update, delete'
  - name: id
    type: string
    description: Item UUID (required for update, delete)
  - name: quotation_id
    type: string
    description: Quotation UUID (required for create, list)
  - name: catalog_item_id
    type: string
    description: Catalog Item UUID
  - name: quantity
    type: number
    description: Quantity (defaults to 1)
  - name: unit_price
    type: number
    description: Unit price
  - name: metadata
    type: string
    description: JSON string of metadata
  - name: limit
    type: number
    description: Limit results for list
  - name: offset
    type: number
    description: Offset results for list
- name: quotations
  description: Manage commercial quotations. Use action="create" to start a draft quotation (requires
    lead_id). Use action="update" to change status (draft, sent, rejected, expired). Use action="list"
    or "get" to read. Use action="delete" to remove.
  docs: https://docs.makinari.com/mcp-server/tools/quotations
  input_schema:
  - name: action
    type: string
    description: 'Action to perform: create, list, get, update, delete'
  - name: id
    type: string
    description: Quotation UUID (required for get, update, delete)
  - name: site_id
    type: string
    description: Site UUID (seller site)
  - name: deal_id
    type: string
    description: Deal UUID to attach this quotation to
  - name: lead_id
    type: string
    description: Lead UUID (required for create)
  - name: buyer_user_id
    type: string
    description: Buyer user UUID
  - name: price_list_id
    type: string
    description: Price list UUID to apply
  - name: status
    type: string
    description: 'Quotation status: draft, sent, rejected, expired'
  - name: valid_until
    type: string
    description: Valid until date (ISO string)
  - name: currency
    type: string
    description: Currency code (e.g. USD)
  - name: notes
    type: string
    description: Notes for the quotation
  - name: limit
    type: number
    description: Limit results for list
  - name: offset
    type: number
    description: Offset results for list
- name: report
  description: 'Query data from the database. Use action="list" to get up to 50 records. Use action="count"
    to get the total matching a filter. IMPORTANT - column reference (the schema is also returned in every
    response as table_schema): • leads: id, created_at, name, email, phone, … • conversations: id, created_at,
    status, channel, … … (schema summary) Tables WITHOUT a direct site_id (scoped automatically via join
    - do NOT filter by site_id on these): • messages - scoped via conversations.site_id • agent_memories
    - scoped via agents.site_id Rules: Never add a site_id filter - it is applied automatical'
  docs: https://docs.makinari.com/mcp-server/tools/report
  input_schema:
  - name: action
    type: string
    description: '"list" returns rows. "count" returns only the total. Enum: list, count'
  - name: table
    type: string
    description: 'Table to query. Enum: leads, conversations, messages, tasks, campaigns, segments, content,
      requirements, agents, commands, visitors, agent_memories, sites'
  - name: columns
    type: array
    description: Columns to return. Omit to return all. Use only column names from table_schema.
  - name: filters
    type: array
    description: Filter conditions. Do NOT include site_id - it is automatic.
  - name: order_by
    type: string
    description: 'Column to sort by. Default: created_at.'
  - name: order_dir
    type: string
