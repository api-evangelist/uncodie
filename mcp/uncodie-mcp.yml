    from, lead_id, conversation_id, agent_id, placeholder_policy. Merge fields (with lead_id ): {{lead.name}}
    , {{lead.first_name}} , {{lead.email}} , {{lead.phone}} , {{lead.position}} , {{lead.company}} , {{lead.notes}}
    , {{lead.metadata.<path>}} , {{site.name}} . Use double braces only; aliases like {{lead.correo}}
    are normalized. Unknown tokens: strip_tokens (default) removes them; skip_recipient aborts the send
    if unresolved tokens remain.'
