source: >-
  https://docs.makinari.com/mcp-server/tools (56 tool pages) and
  https://docs.makinari.com/rest-api, /agents, /workflows, /content-api
  (125 reference pages harvested 2026-08-13)
notes: >-
  Makinari publishes no OpenAPI document, so there are no operationIds to bind
  to. This crosswalk binds each documented MCP tool to the REST path(s) the
  provider prints on that tool's OWN documentation page — 35 of 56 tools
  publish their REST equivalent explicitly, which is why those bindings are
  high confidence rather than name-matched guesses. `rest:` therefore carries
  "METHOD-less" documented paths as published (the tool pages state the path,
  not always the verb; every tools route the docs show a verb for is POST).
  Nothing is inferred: a tool with no published REST path is listed under
  mcp_only[] rather than mapped by name similarity.
  THE HEADLINE DIVERGENCE: the entire commerce cluster is MCP-ONLY. quotations,
  quotation_items, purchases, purchase_items, checkout, catalog_commerce,
  entitlements, subscription_plan_items, reservations and reservation_schedules
  are documented as MCP tools with full input schemas but have no REST route
  published anywhere. An integrator who cannot speak MCP cannot reach
  Makinari's commerce surface at all. In the other direction, 119 documented
  REST operations — the whole Agents API (per-agent chat, CMO, copywriter,
  customer support, data analyst, email, growth, sales, UX, WhatsApp), the
  Robots browser-automation surface, Visitors, Finder, Instances, API keys,
  Secure Tokens and the public Content API — have no MCP tool.
  These are overlapping-but-non-identical projections of one core, exactly as
  the pipeline expects; neither is a superset.
