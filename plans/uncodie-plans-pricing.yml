usage_pricing:
  description: >-
    Metered "Variable Costs & Additional Credits" published alongside the tiers.
    Credits can be topped up at any time.
  items:
    - item: Partner ICP Lead
      price: 0.50
      unit: per highly qualified lead generated by AI from the Ideal Partner Profile
    - item: Outsourced Partner Meeting
      price: 20
      unit: fixed fee per initial partner-recruitment meeting scheduled
    - item: Successful Partner Recruitment
      price: 10
      unit: bonus when the meeting results in signing a new partner
    - item: API Call / Deep Research
      price: 0.01
      unit: per AI API request or deep web data extraction
    - item: Input tokens
      price: 1
      unit: per 1M input text tokens
    - item: Output tokens
      price: 20
      unit: per 1M output text tokens
    - item: Audio input
      price: 0.50
      unit: per minute processed and transcribed
    - item: Audio output
      price: 2
      unit: per minute of synthetic voice generation
    - item: AI video
      price: 20
      unit: per minute of AI-generated video
