notes: >-
  Makinari (formerly Uncodie) publishes NO client SDK to any public package
  registry. Every candidate name was queried directly against the registry
  metadata endpoints on 2026-08-13 and returned 404: npm `makinari`,
  `@makinari/mcp`, `@makinari/sdk`, `uncodie`, `@uncodie/mcp`, `marketfit`;
  PyPI `makinari`, `uncodie`. npm keyword search for "makinari", "uncodie" and
  "marketfit" returns no first-party result either.
  This matters because the company's own developer page
  (https://www.makinari.com/product/api) shows the code sample
  `import { MCPServer } from '@makinari/mcp'` — a package that does not exist
  on npm. The advertised import is not installable.
  What Makinari does ship is SOURCE, not packages: three first-party
  application repositories under github.com/Uncodier plus an installer CLI
  under github.com/makinary, all consumed by `git clone`, none published to a
  registry and none carrying a version a consumer could pin.
