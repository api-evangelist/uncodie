license_inconsistency:
  finding: >-
    The open-source posture is stated three different ways and none of them is
    a license file. makinari.org advertises "100% Open Source / AGPL-3.0"; the
    documentation site footer reads "MIT 2026 © Makinari"; and all three
    repositories declare "private": true in package.json with no `license`
    field and no LICENSE file at the root (probed 2026-08-13, all 404).
  evidence:
    - url: https://makinari.org
      status: 200
      claim: '3 Repositories / 100% Open Source / AGPL-3.0 License'
    - url: https://docs.makinari.com/rest-api
      status: 200
      claim: 'Footer: MIT 2026 © Makinari'
    - url: https://raw.githubusercontent.com/Uncodier/API/main/LICENSE
      status: 404
    - url: https://raw.githubusercontent.com/Uncodier/market-fit/master/LICENSE
      status: 404
    - url: https://raw.githubusercontent.com/Uncodier/workflows/main/LICENSE
      status: 404
