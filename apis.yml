apis:
- name: Makinari REST API
  description: >-
    Core Makinari platform API covering Visitors (tracking and
    identification), Finder (contact and company search), Robots
    (browser-automation instances), Instances, Requirements, and Secure
    Tokens. API-key Bearer authentication; all endpoints versioned under v1.
    The docs quote https://api.makinari.io/v1 as the base URL, but that host
    does not currently resolve; the live application host serving /api/*
    routes is backend.makinari.com.
  humanURL: https://docs.makinari.com/rest-api
  baseURL: https://backend.makinari.com/api
  tags:
  - REST
  - Visitors
  - Leads
  - Automation
  properties:
  - type: Documentation
    url: https://docs.makinari.com/rest-api
  - type: APIReference
    url: https://docs.makinari.com/rest-api
- name: Makinari Content API
  description: >-
    Public content delivery API for Makinari sites — fetch published blog
    posts, RSS feeds, and other content types for headless frontends,
    directories, and syndication. Browser requests from the registered site
    domain need no key; server-to-server requests require an API key.
  humanURL: https://docs.makinari.com/content-api
  baseURL: https://backend.makinari.com/api
  tags:
  - Content
  - CMS
  - RSS
  properties:
  - type: Documentation
    url: https://docs.makinari.com/content-api
  - type: APIReference
    url: https://docs.makinari.com/content-api
- name: Makinari Agents API
  description: >-
    Per-agent HTTP endpoints — 48 documented operations under /api/agents/*
    covering chat (including a WebSocket channel and human intervention), the
    CMO agent (daily stand-ups for sales, growth and system; lead assignment;
    stakeholder coordination), copywriter (content calendar, editor, improve),
    customer support (conversations, messages, status), data analyst
    (analysis, deep research, lead and company contact generation, lead
    segmentation, search), email (analyze, check, reply, alias reply, leads
    reply, delivery status, sync), growth (campaigns, requirements, segments,
    ICP, robot plan), sales (lead generation, research, selection, follow-up,
    region search and venues), UX analyze, and WhatsApp (analyze, create and
    send templates, inbound webhook). API-key Bearer authentication. Several
    endpoints accept a `webhook` parameter for asynchronous results. Paths are
    NOT versioned, unlike the /v1 REST API. The published status page reported
    this API "down" with 0% 24h/30d uptime on both 2026-07-21 and 2026-08-13.
  humanURL: https://docs.makinari.com/agents
  baseURL: https://backend.makinari.com/api
  tags:
  - AI Agents
  - Sales
  - Marketing
  - Email
  - WhatsApp
  properties:
  - type: Documentation
    url: https://docs.makinari.com/agents
  - type: APIReference
    url: https://docs.makinari.com/agents
- name: Makinari Workflows API
  description: >-
    Temporal-backed process automation — 25 documented workflows triggered at
    POST /api/workflow/<name> (agentMessage, analyzeSite, assignLeads,
    buildCampaigns, buildContent, buildSegments, buildSegmentsICP,
    customerSupport, dailyStandUp, deepResearch, enrichLead,
    humanIntervention, idealClientProfileMining, keyAccountGeneration,
    leadFollowUp, leadFollowUpManagement, leadGeneration, leadInvalidation,
    leadQualificationManagement, leadResearch, promptRobot, startRobot,
    stopRobot, syncEmails), plus an inbound webhook at
    POST /api/workflow/webhook that receives database change events, resolves
    active subscriptions by site and table, and dispatches a workflow
    asynchronously. Also exposed as the `workflows` MCP tool.
  humanURL: https://docs.makinari.com/workflows
  baseURL: https://backend.makinari.com/api
  tags:
  - Workflows
  - Automation
  - Temporal
  - Webhook
  tags_raw:
  - Workflows
  - Automation
  - Temporal
  - Webhooks
  properties:
  - type: Documentation
    url: https://docs.makinari.com/workflows
  - type: APIReference
    url: https://docs.makinari.com/workflows
- name: Makinari MCP Server
  description: >-
    Official hosted Model Context Protocol server at
    POST https://backend.makinari.com/api/mcp (JSON-RPC 2.0 over HTTP),
    exposing 56 documented tools each with a published input schema — CRM
    (leads, deals, segments, audience, tasks), messaging (email, WhatsApp,
    bulk send, templates, conversations), content and media generation
    (image, video, audio, transcription, frame extraction), prospecting
    (Finder category IDs, ICP sizing and mining, region venues), research
    (web search, URL to markdown, URL to sitemap), agent state (memories,
    instances, instance plans and logs, requirements), automation (workflows,
    webhooks), and a commerce core (catalog, quotations and line items,
    purchases, checkout with Stripe payment links, sales orders,
    entitlements, subscription plan items, reservations) that has no REST
    equivalent. Authentication reuses the platform API keys via
    Authorization: Bearer or X-API-Key — there is no OAuth surface. The same
    server can be run locally over stdio from the public source repository.
  humanURL: https://docs.makinari.com/mcp-server
  baseURL: https://backend.makinari.com/api/mcp
  tags:
  - MCP
  - AI Agents
  - Tools
  - Commerce
  properties:
  - type: Documentation
    url: https://docs.makinari.com/mcp-server
  - type: APIReference
    url: https://docs.makinari.com/mcp-server/tools
  - type: MCPServer
    url: mcp/uncodie-mcp.yml
  - type: ToolCrosswalk
    url: mcp/uncodie-tool-crosswalk.yml
