aid: uncodie
name: Uncodie (now Makinari)
description: >-
  Uncodie, a 500 Global portfolio company, rebranded as Makinari — an AI-agent
  business platform that builds the application a business needs and then runs
  growth on top of it with a team of AI agents (CMO, sales, growth, copywriter,
  customer support, data analyst, email, WhatsApp, UX) plus a CRM. Developers
  get a versioned REST API (Visitors, Finder, Robots, Instances, Requirements,
  Secure Tokens), a per-agent Agents API, a Temporal-backed Workflows API, a
  public Content API for headless delivery, webhooks, an embeddable chat
  widget, and an official hosted MCP server exposing 56 documented tools —
  including a full commerce core (catalog, quotations, checkout, sales orders,
  entitlements, reservations) that is reachable ONLY over MCP. No OpenAPI is
  published. The platform source is public at makinari.org
  (github.com/Uncodier). www.uncodie.com now redirects to www.makinari.com.
