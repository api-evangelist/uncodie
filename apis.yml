apis:
- name: Makinari REST API
  description: >-
    Core Makinari platform API covering Visitors (tracking and
    identification), Finder (contact and company search), Robots
    (browser-automation instances), Instances, Requirements, and Secure
    Tokens. API-key Bearer authentication; all endpoints versioned under v1.
    The docs quote https://api.makinari.io/v1 as the base URL, but that host
    does not currently resolve; the live application host serving /api/*
    routes is backend.makinari.com.
  humanURL: https://docs.makinari.com/rest-api
  baseURL: https://backend.makinari.com/api
  tags:
  - REST
  - Visitors
  - Leads
  - Automation
  properties:
  - type: Documentation
    url: https://docs.makinari.com/rest-api
  - type: APIReference
    url: https://docs.makinari.com/rest-api
- name: Makinari Content API
  description: >-
    Public content delivery API for Makinari sites — fetch published blog
    posts, RSS feeds, and other content types for headless frontends,
    directories, and syndication. Browser requests from the registered site
    domain need no key; server-to-server requests require an API key.
  humanURL: https://docs.makinari.com/content-api
  baseURL: https://backend.makinari.com/api
  tags:
  - Content
  - CMS
  - RSS
  properties:
  - type: Documentation
    url: https://docs.makinari.com/content-api
