versioning:
  scheme: uri-path
  current: v1
  docs: https://docs.makinari.com/rest-api
  notes: >-
    All REST endpoints are versioned; the current stable version is v1. The
    documentation quotes the base URL as https://api.makinari.io/v1, but that
    host has not resolved in DNS on any pass (2026-07-21 and 2026-08-13); the
    live application host serving the /api/* routes — including the hosted MCP
    server — is https://backend.makinari.com. The Agents, Workflows and Content
    APIs are documented as unversioned /api/... paths on the same host, so the
    v1 prefix is not applied uniformly across the platform.
